<div class="category-management">
  <h2>إدارة الفئات</h2>

  <button class="add-btn" (click)="showForm = true">إضافة فئة جديدة</button>

  <div class="category-form" *ngIf="showForm">
    <h3>{{ editingCategory ? 'تعديل الفئة' : 'إضافة فئة جديدة' }}</h3>
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>اسم الفئة</label>
        <input type="text" formControlName="name" class="form-control">
      </div>

      <div class="form-group">
        <label>الوصف</label>
        <textarea formControlName="description" class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label>رابط الصورة</label>
        <input type="text" formControlName="image" class="form-control">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {{ editingCategory ? 'تحديث' : 'إضافة' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="resetForm()">إلغاء</button>
      </div>
    </form>
  </div>

  <div class="categories-list">
    <table class="table">
      <thead>
        <tr>
          <th>الصورة</th>
          <th>الاسم</th>
          <th>الوصف</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories">
          <td><img [src]="category.image" [alt]="category.name" class="category-image"></td>
          <td>{{ category.name }}</td>
          <td>{{ category.description }}</td>
          <td>
            <button class="btn btn-edit" (click)="editCategory(category)">تعديل</button>
            <button class="btn btn-delete" (click)="deleteCategory(category.id)">حذف</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
