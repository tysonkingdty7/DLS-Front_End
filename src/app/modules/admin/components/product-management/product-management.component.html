<div class="product-management">
  <h2>إدارة المنتجات</h2>

  <button class="add-btn" (click)="showForm = true">إضافة منتج جديد</button>

  <div class="product-form" *ngIf="showForm">
    <h3>{{ editingProduct ? 'تعديل المنتج' : 'إضافة منتج جديد' }}</h3>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>اسم المنتج</label>
        <input type="text" formControlName="name" class="form-control">
      </div>

      <div class="form-group">
        <label>الوصف</label>
        <textarea formControlName="description" class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label>السعر</label>
        <input type="number" formControlName="price" class="form-control">
      </div>

      <div class="form-group">
        <label>الفئة</label>
        <input type="text" formControlName="category" class="form-control">
      </div>

      <div class="form-group">
        <label>المخزون</label>
        <input type="number" formControlName="stock" class="form-control">
      </div>

      <div class="form-group">
        <label>الصورة</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" class="form-control">
        <img *ngIf="imagePreview" [src]="imagePreview" class="image-preview" alt="معاينة الصورة">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {{ editingProduct ? 'تحديث' : 'إضافة' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="resetForm()">إلغاء</button>
      </div>
    </form>
  </div>

  <div class="products-list">
    <table class="table">
      <thead>
        <tr>
          <th>الصورة</th>
          <th>الاسم</th>
          <th>السعر</th>
          <th>المخزون</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td><img [src]="product.image" [alt]="product.name" class="product-image"></td>
          <td>{{ product.name }}</td>
          <td>${{ product.price }}</td>
          <td>{{ product.stock }}</td>
          <td>
            <button class="btn btn-edit" (click)="editProduct(product)">تعديل</button>
            <button class="btn btn-delete" (click)="deleteProduct(product.id)">حذف</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
