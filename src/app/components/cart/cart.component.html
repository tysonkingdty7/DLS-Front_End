<div class="container mt-4">
  <h2>Shopping Cart</h2>
  
  <div *ngIf="cartItems.length === 0" class="alert alert-info">
    Your cart is empty. <a routerLink="/products">Continue shopping</a>
  </div>

  <div *ngIf="cartItems.length > 0">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cartItems">
            <td>
              <img [src]="item.product.image" [alt]="item.product.name" style="width: 50px;">
              {{item.product.name}}
            </td>
            <td>{{item.product.price | currency}}</td>
            <td>
              <div class="input-group" style="width: 150px;">
                <button class="btn btn-outline-secondary" (click)="updateQuantity(item.product.id, item.quantity - 1)">-</button>
                <input type="number" class="form-control text-center" [value]="item.quantity" readonly>
                <button class="btn btn-outline-secondary" (click)="updateQuantity(item.product.id, item.quantity + 1)">+</button>
              </div>
            </td>
            <td>{{item.product.price * item.quantity | currency}}</td>
            <td>
              <button class="btn btn-danger" (click)="removeItem(item.product.id)">
                Remove
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="row mt-4">
      <div class="col-md-6">
        <button class="btn btn-outline-secondary" (click)="clearCart()">
          Clear Cart
        </button>
      </div>
      <div class="col-md-6 text-end">
        <h4>Total: {{total | currency}}</h4>
        <button class="btn btn-primary" routerLink="/checkout">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>
</div>
