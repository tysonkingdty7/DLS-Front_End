<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Search products..." 
               [(ngModel)]="searchQuery" (keyup.enter)="searchProducts()">
        <button class="btn btn-primary" (click)="searchProducts()">Search</button>
      </div>
    </div>
    <div class="col-md-6">
      <select class="form-select" [(ngModel)]="selectedCategory" (change)="filterByCategory(selectedCategory)">
        <option value="">All Categories</option>
        <option *ngFor="let category of categories" [value]="category">
          {{category}}
        </option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of filteredProducts">
      <div class="card h-100">
        <img [src]="product.image" class="card-img-top" [alt]="product.name">
        <div class="card-body">
          <h5 class="card-title">{{product.name}}</h5>
          <p class="card-text">{{product.description | slice:0:100}}...</p>
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="h5">{{product.price | currency}}</span>
              <span *ngIf="product.discount" class="text-danger ms-2">
                -{{product.discount}}%
              </span>
            </div>
            <span class="badge bg-primary">{{product.category}}</span>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary w-100" [routerLink]="['/products', product.id]">
            View Details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
