<div class="home-container">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1>Welcome to Our Store</h1>
          <p class="lead">Discover amazing products at great prices</p>
          <button class="btn btn-primary btn-lg" routerLink="/products">Shop Now</button>
        </div>
        <div class="col-md-6">
          <img src="assets/images/hero-image.jpg" alt="Hero Image" class="img-fluid">
        </div>
      </div>
    </div>
  </section>

  <!-- Featured Products -->
  <section class="featured-products py-5">
    <div class="container">
      <h2 class="text-center mb-4">Featured Products</h2>
      <div class="row">
        <div class="col-md-3 mb-4" *ngFor="let product of featuredProducts">
          <div class="card h-100">
            <img [src]="product.image" class="card-img-top" [alt]="product.name">
            <div class="card-body">
              <h5 class="card-title">{{product.name}}</h5>
              <p class="card-text">{{product.price | currency}}</p>
              <button class="btn btn-primary" [routerLink]="['/products', product.id]">View Details</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- New Arrivals -->
  <section class="new-arrivals py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-4">New Arrivals</h2>
      <div class="row">
        <div class="col-md-3 mb-4" *ngFor="let product of newProducts">
          <div class="card h-100">
            <img [src]="product.image" class="card-img-top" [alt]="product.name">
            <div class="card-body">
              <h5 class="card-title">{{product.name}}</h5>
              <p class="card-text">{{product.price | currency}}</p>
              <button class="btn btn-primary" [routerLink]="['/products', product.id]">View Details</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Call to Action -->
  <section class="cta-section py-5">
    <div class="container text-center">
      <h2>Ready to Start Shopping?</h2>
      <p class="lead">Join thousands of satisfied customers</p>
      <button class="btn btn-primary btn-lg" routerLink="/register">Create Account</button>
    </div>
  </section>
</div>
