<div class="container mt-4" *ngIf="product">
  <div class="row">
    <div class="col-md-6">
      <img [src]="product.image" class="img-fluid" [alt]="product.name">
    </div>
    <div class="col-md-6">
      <h1>{{product.name}}</h1>
      <div class="mb-3">
        <span class="h3">{{product.price | currency}}</span>
        <span *ngIf="product.discount" class="text-danger ms-2">
          -{{product.discount}}%
        </span>
      </div>
      <p class="text-muted">Category: {{product.category}}</p>
      <p>{{product.description}}</p>
      
      <div class="mb-3">
        <label class="form-label">Quantity:</label>
        <div class="input-group" style="width: 150px;">
          <button class="btn btn-outline-secondary" (click)="decreaseQuantity()">-</button>
          <input type="number" class="form-control text-center" [(ngModel)]="quantity" readonly>
          <button class="btn btn-outline-secondary" (click)="increaseQuantity()">+</button>
        </div>
        <small class="text-muted">Available: {{product.stock}} in stock</small>
      </div>

      <button class="btn btn-primary btn-lg" (click)="addToCart()">
        Add to Cart
      </button>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12">
      <h3>Product Details</h3>
      <table class="table">
        <tbody>
          <!-- <tr>
            <th>Rating</th>
            <td>
              <span class="text-warning">★</span>
              {{product.rating}} ({{product.reviews}} reviews)
            </td>
          </tr> -->
          <tr>
            <th>Availability</th>
            <td>
              <span [class]="product.stock > 0 ? 'text-success' : 'text-danger'">
                {{product.stock > 0 ? 'متوفر في المخزون' : 'غير متوفر'}}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
